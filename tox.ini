[tox]
envlist =
    py27-dj{111},
    py36-dj{21,22,30,31,dev}
    py37-dj{21,22,30,31,dev}
    py38-dj{21,22,30,31,dev}
    py39-dj{21,22,30,31,dev}
    py310-dj{30,31,42}
    py311-dj{30,31,42}

[testenv]
basepython =
    py27: python2.7
    py36: python3.6
    py37: python3.7
    py38: python3.8
    py39: python3.9
    py310: python3.10
    py311: python3.11
deps =
    dj111: Django>=1.11,<2.0
    dj21: Django>=2.1,<2.2
    dj22: Django>=2.2,<3.0
    dj30: Django>=3.0,<3.1
    dj31: Django>=3.1,<3.2
    dj42: Django>=4.2,<5
    djdev: https://github.com/django/django/archive/master.tar.gz
commands =
  python -V
  python -Wall test_proj/manage.py test

[pep8]
exclude = migrations,.tox,docs,test_proj,setup.py
