[tox]
envlist =
    py{310,311,312}-dj42
    py{310,311,312,313}-dj52
    py{312,313}-dj60

[testenv]
deps =
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
commands =
  python -V
  python -Wall test_proj/manage.py test

[pep8]
exclude = migrations,.tox,docs,test_proj,setup.py
