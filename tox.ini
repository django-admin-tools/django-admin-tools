[tox]
envlist =
    py27-dj111
    py{36,37,38,39}-dj{21,22,30,31}
    py{36,37,38,39,310}-dj32
    py{38,39,310,311,312}-dj42
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314,315}-dj61
    py{312,313,314,315}-djdev

[testenv]
deps =
    dj111: Django>=1.11,<2.0
    dj21: Django>=2.1,<2.2
    dj22: Django>=2.2,<3.0
    dj30: Django>=3.0,<3.1
    dj31: Django>=3.1,<3.2
    dj32: Django>=3.2,<4.0
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djdev: https://github.com/django/django/archive/main.tar.gz
commands =
  python -V
  python -Wall test_proj/manage.py test

[pep8]
exclude = migrations,.tox,docs,test_proj,setup.py
